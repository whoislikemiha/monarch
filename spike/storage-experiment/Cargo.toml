[package]
name = "mon91-storage-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "MON-91 throwaway spike: SQLite BLOB + HNSW + ONNX viability for shadow memory"

[lib]
path = "src/lib.rs"

[[bin]]
name = "generate_data"
path = "src/bin/generate_data.rs"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"

[[bin]]
name = "bench_query"
path = "src/bin/bench_query.rs"

[[bin]]
name = "embed"
path = "src/bin/embed.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
instant-distance = { version = "0.6", features = ["with-serde"] }
bincode = "1"
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
rand = "0.8"
rand_distr = "0.4"
bytemuck = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
