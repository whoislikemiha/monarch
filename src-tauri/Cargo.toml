[package]
name = "monarch"
version = "0.1.0"
edition = "2021"

[lib]
name = "monarch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "monarch"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
dashmap = "6"
parking_lot = "0.12"
specta = { version = "2.0.0-rc.24", features = ["serde_json", "derive"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.24", features = ["derive", "typescript"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
base64 = "0.22"
toml = "0.8"
ignore = "0.4"
nucleo-matcher = "0.3"

# --- MON-91 bundle-probe (temporary; reverted before merge) ---
# These deps exist only so `npm run tauri build` measures the bundle-size
# impact of the shadow-memory storage stack. The _spike_bundle_probe module
# references each one so the linker cannot prune them.
instant-distance = { version = "0.6", features = ["with-serde"] }
bincode = "1"
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
bytemuck = "1"
# --- /MON-91 bundle-probe ---

[build-dependencies]
tauri-build = { version = "2", features = [] }
