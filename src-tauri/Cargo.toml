[package]
name = "monarch"
version = "0.1.0"
edition = "2021"

[lib]
name = "monarch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "monarch"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
dirs = "6"
rusqlite = { version = "0.33", features = ["bundled"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
dashmap = "6"
parking_lot = "0.12"
specta = { version = "2.0.0-rc.24", features = ["serde_json", "derive"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.24", features = ["derive", "typescript"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
